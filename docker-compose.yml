name: trading-intelligence

services:
  postgres:
    image: postgres:16-alpine
    container_name: tip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tip
      POSTGRES_PASSWORD: tip_password
      POSTGRES_DB: tip
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tip -d tip']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tip-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: tip-ai
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-service-token-change-me}
      ENABLE_FINBERT: ${ENABLE_FINBERT:-0}
      MODEL_CACHE_DIR: /app/.model_cache
      REDIS_URL: redis://redis:6379
    ports:
      - '8000:8000'
    volumes:
      - model-cache:/app/.model_cache
    depends_on:
      redis:
        condition: service_healthy
    profiles: ['full']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tip-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tip:tip_password@postgres:5432/tip?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-ai-service-token-change-me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000
      API_PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ['full']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        NEXT_PUBLIC_WS_URL: http://localhost:4000
    container_name: tip-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api
    profiles: ['full']

volumes:
  postgres-data:
  redis-data:
  model-cache:
