name: diagnostics

# The §1.5 reconciliation check, plus the engine smoke test it depends on.
#
# This runs on every push because the failure it catches is silent: a provider
# changes a field, a timezone shifts, a feed starts including the forming bar,
# and the live path and the replay path quietly stop computing the same thing.
# Every test that does not compare the two paths stays green while that happens.
#
# When DIAGNOSTICS_SIGNAL_LOG and DIAGNOSTICS_CANDLES point at real artefacts,
# the reconciliation runs as a full field-by-field comparison and any nonzero
# diff fails the build. Without them it reports as skipped rather than passing —
# a check that passes when it did not run is worse than one that fails.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  ai-diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Engine smoke test
        run: python selftest.py

      - name: Diagnostics self-test (determinism, look-ahead, reconciliation)
        run: python diagnostics_selftest.py
        env:
          # Point these at artefacts restored from the running service to
          # upgrade the reconciliation from "skipped" to a real comparison.
          DIAGNOSTICS_SIGNAL_LOG: ${{ vars.DIAGNOSTICS_SIGNAL_LOG }}
          DIAGNOSTICS_CANDLES: ${{ vars.DIAGNOSTICS_CANDLES }}
